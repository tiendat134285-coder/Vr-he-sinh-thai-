<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Trình xem Video 360 Độ</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      /* Giao diện cho nút Play đè lên màn hình */
      #playButton {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        padding: 15px 30px;
        background: #ff4757;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        font-family: sans-serif;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <button id="playButton">Bấm vào đây để xem Video 360</button>

    <a-scene>
      <a-assets>
        <video id="video360" src="1.mp4.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>
      
      <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>
      <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
      const btn = document.getElementById('playButton');
      const video = document.querySelector('#video360');

      btn.addEventListener('click', function () {
        // Phát video
        video.play().then(() => {
          // Nếu phát thành công thì ẩn nút bấm đi
          btn.style.display = 'none';
        }).catch(err => {
          alert("Không thể phát video: " + err.message);
        });
      });
    </script>
  </body>
</html>

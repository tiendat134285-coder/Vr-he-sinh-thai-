<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Trình xem Video 360 Độ</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <video id="video360" src="1.mp4.mp4" loop="true" autoplay="true" muted crossorigin="anonymous" playsinline></video>
      </a-assets>
      
      <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>
      
      <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
      // Trình duyệt hiện tại chặn tự động phát video có tiếng (Autoplay Policy)
      // Đoạn script này giúp kích hoạt chạy video ngay khi người dùng chạm/click vào màn hình
      document.body.addEventListener('click', function () {
        const video = document.querySelector('#video360');
        if (video.paused) {
          video.muted = false; // Bật lại âm thanh nếu muốn khi bắt đầu phát
          video.play().catch(function(error) {
            console.log("Kích hoạt video thất bại:", error);
          });
        }
      }, { once: true }); // "once: true" đảm bảo sự kiện này chỉ chạy một lần duy nhất ở lần click đầu tiên
    </script>
  </body>
</html>
